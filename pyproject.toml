[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuk-robotics-bimanual"
version = "0.1.0"
description = "Project scaffold for SmolVLA bimanual beverage manipulation with dual SO-101 arms"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "cuk-robotics contributors"}]
dependencies = []

[project.optional-dependencies]
# Provisional integration target. Pin a tested release before collecting data or training.
robotics = ["lerobot[smolvla]"]

[project.urls]
Repository = "https://github.com/cuk-robotics/smolvla-bimanual-manipulation"
Issues = "https://github.com/cuk-robotics/smolvla-bimanual-manipulation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
