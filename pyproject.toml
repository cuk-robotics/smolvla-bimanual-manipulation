[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuk-robotics-bimanual"
version = "0.1.0"
description = "LeRobot workflows for SmolVLA bimanual beverage manipulation with dual SO-101 arms"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "cuk-robotics contributors"}]
dependencies = []

[project.optional-dependencies]
robotics = ["lerobot[core_scripts,feetech]==0.6.1", "rerun-sdk==0.33.1", "PyYAML==6.0.3"]
training = ["lerobot[training,smolvla]==0.6.1"]

[project.scripts]
cuk-robotics = "cuk_robotics.teleoperation.cli:main"
cuk-camera-preview = "cuk_robotics.cameras.preview:entrypoint"

[project.urls]
Repository = "https://github.com/cuk-robotics/smolvla-bimanual-manipulation"
Issues = "https://github.com/cuk-robotics/smolvla-bimanual-manipulation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
