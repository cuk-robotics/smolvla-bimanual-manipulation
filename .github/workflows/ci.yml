name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_config.py
      - run: python scripts/check_git_hygiene.py
      - name: Check standard-library-only behavior
        run: python -S -m unittest discover -s tests -v
      - name: Install data test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements/test-data.txt
      - name: Test data and camera helpers without hardware
        run: python -m unittest discover -s tests -v
